name: Release
# Publishes the version below once; re-running is a no-op if the tag exists.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then echo "v0.1.0 already exists"; exit 0; fi
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "v0.1.0 — first public release" --notes "First public release of newstriage: RSS/Atom triage with dedup and clustering, a 100-point rule-based rubric and optional Claude enrichment under strict guards: every claim cites a source from the input or is dropped. Default topic: AI model releases and research. 63 tests, no network needed."
